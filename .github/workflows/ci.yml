name: Linux build and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MiniLibX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libx11-dev libxext-dev libbsd-dev

      - name: Compile application
        run: make -j2

      - name: Run headless regression tests
        run: make test
